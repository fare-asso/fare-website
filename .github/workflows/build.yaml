name: Build and push container

on:
    workflow_dispatch:
    push:
        branches:
            - "main"
        tags-ignore:
            - "v*" # Ignore version tags

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to ATCR
              uses: docker/login-action@v4
              with:
                  registry: atcr.io
                  username: ${{ secrets.ATCR_USERNAME }}
                  password: ${{ secrets.ATCR_PASSWORD }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: atcr.io/finxol.eu/fare-website
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix=,format=short

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}
                      PUBLIC_FRIENDLY_CAPTCHA_SITE_KEY=${{ secrets.PUBLIC_FRIENDLY_CAPTCHA_SITE_KEY }}
                      PUBLIC_SENTRY_DSN=${{ secrets.PUBLIC_SENTRY_DSN }}
                  secrets: |
                      SUPABASE_POSTGRES_PRISMA_DIRECT_URL=${{ secrets.SUPABASE_POSTGRES_PRISMA_DIRECT_URL }}
