name: Build and push container

on:
    workflow_dispatch:
    push:
        branches:
            - "main"
        tags-ignore:
            - "v*" # Ignore version tags

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix=,format=short

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}
                      PUBLIC_FRIENDLY_CAPTCHA_SITE_KEY=${{ secrets.PUBLIC_FRIENDLY_CAPTCHA_SITE_KEY }}
                      PUBLIC_SENTRY_DSN=${{ secrets.PUBLIC_SENTRY_DSN }}
                  secrets: |
                      SUPABASE_POSTGRES_PRISMA_DIRECT_URL=${{ secrets.SUPABASE_POSTGRES_PRISMA_DIRECT_URL }}

            - name: Trigger deployment
              run: |
                  curl -sfS -X POST "https://dev.fare-asso.fr/api/compose.deploy" \
                    -H "Content-Type: application/json" \
                    -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
                    -d "{\"composeId\": \"${{ secrets.DOKPLOY_PROD_COMPOSE_ID }}\"}"
