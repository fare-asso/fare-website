name: Code Checks

on:
    pull_request:
    push:
        branches:
            - "main"
        tags-ignore:
            - "v*" # Ignore version tags

jobs:
    quality:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            SUPABASE_POSTGRES_PRISMA_URL: "postgresql://ci:ci@localhost:5432/ci"
            FRIENDLY_CAPTCHA_API_KEY: "ci"
            SUPABASE_SERVICE_ROLE_KEY: "ci"
            SMTP_HOST: "smtp.example.com"
            SMTP_USER: "ci"
            SMTP_PASS: "ci"
            SMTP_FROM_EMAIL: "ci@example.com"
            PUBLIC_SUPABASE_URL: "http://localhost:54321"
            SUPABASE_ANON_KEY: "ci"
            PUBLIC_FRIENDLY_CAPTCHA_SITE_KEY: "ci"
            PUBLIC_SENTRY_DSN: "https://ci@ci.ingest.sentry.io/0"
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install UPM
              run: npm install --global upm@1.4.0

            - name: Cache UPM store
              uses: actions/cache@v4
              with:
                  path: ~/.upm/store
                  key: upm-${{ runner.os }}-${{ hashFiles('upm.lock') }}

            - name: Install dependencies
              run: upm install --frozen-lockfile

            - name: Generate Prisma Client
              run: upm exec prisma generate

            - name: Sync Astro
              run: upm exec astro sync

            - name: Check linting
              run: upm run check:lint --format=github

            - name: Check types
              run: upm run check:types

            - name: Check formatting
              run: upm run check:format

            - name: Knip project
              run: upm run knip

    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install UPM
              run: npm install --global upm@1.4.0

            - name: Cache UPM store
              uses: actions/cache@v4
              with:
                  path: ~/.upm/store
                  key: upm-${{ runner.os }}-${{ hashFiles('upm.lock') }}

            - name: Install dependencies
              run: upm install --frozen-lockfile

            - name: Generate Prisma Client
              run: upm exec prisma generate

            - name: Run node tests
              run: upm run test:node

            - name: Install Playwright Chromium
              run: upm exec playwright install --with-deps chromium

            - name: Run browser tests
              run: upm run test:browser
