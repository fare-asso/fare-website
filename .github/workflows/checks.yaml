name: Code Checks

on:
    pull_request:
    push:
        branches:
            - "main"
        tags-ignore:
            - "v*" # Ignore version tags

jobs:
    quality:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              name: Install pnpm
              with:
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install

            - name: Generate Prisma Client
              run: pnpm exec prisma generate

            - name: Check linting
              run: pnpm run check:lint --format=github

            - name: Check types
              run: pnpm run check:types

            - name: Check formatting
              run: pnpm run check:format

            - name: Knip project
              run: pnpm run knip

            - name: Build
              run: pnpm run build
              env:
                  SUPABASE_POSTGRES_PRISMA_URL: postgresql://test:test@localhost:5432/test
                  FRIENDLY_CAPTCHA_API_KEY: test-fc-api-key
                  SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
                  SMTP_HOST: smtp.test.local
                  SMTP_PORT: "465"
                  SMTP_SECURE: "true"
                  SMTP_USER: test-user
                  SMTP_PASS: test-pass
                  SMTP_FROM_EMAIL: noreply@fare-asso.fr
                  VITE_SUPABASE_URL: http://localhost:54321
                  VITE_SUPABASE_ANON_KEY: test-anon-key
                  VITE_SITE_URL: http://localhost:3000
                  VITE_FRIENDLY_CAPTCHA_SITE_KEY: test-site-key
                  VITE_SENTRY_DSN: https://test@test.ingest.sentry.io/0

    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              name: Install pnpm
              with:
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install

            - name: Generate Prisma Client
              run: pnpm exec prisma generate

            - name: Run node tests
              run: pnpm run test:node

            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Run browser tests
              run: pnpm run test:browser
