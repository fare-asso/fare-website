name: Code Checks

on:
    pull_request:
    push:
        branches:
            - "main"
        tags-ignore:
            - "v*" # Ignore version tags

jobs:
    quality:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            SUPABASE_POSTGRES_PRISMA_URL: "postgresql://ci:ci@localhost:5432/ci"
            FRIENDLY_CAPTCHA_API_KEY: "ci"
            SUPABASE_SERVICE_ROLE_KEY: "ci"
            SMTP_HOST: "smtp.example.com"
            SMTP_USER: "ci"
            SMTP_PASS: "ci"
            SMTP_FROM_EMAIL: "ci@example.com"
            PUBLIC_SUPABASE_URL: "http://localhost:54321"
            PUBLIC_SUPABASE_ANON_KEY: "ci"
            PUBLIC_FRIENDLY_CAPTCHA_SITE_KEY: "ci"
            PUBLIC_SENTRY_DSN: "https://ci@ci.ingest.sentry.io/0"
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              name: Install pnpm
              with:
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install

            - name: Generate Prisma Client
              run: pnpm exec prisma generate

            - name: Sync Astro
              run: pnpm exec astro sync

            - name: Check linting
              run: pnpm run check:lint --format=github

            - name: Check types
              run: pnpm run check:types

            - name: Check formatting
              run: pnpm run check:format

            - name: Knip project
              run: pnpm run knip

    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v4
              name: Install pnpm
              with:
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install

            - name: Generate Prisma Client
              run: pnpm exec prisma generate

            - name: Run node tests
              run: pnpm run test:node

            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Run browser tests
              run: pnpm run test:browser
