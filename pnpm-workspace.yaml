minimumReleaseAge: 1440 # 1 day
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
  - "chokidar@4.0.3"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  '@sentry/cli': true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  supabase: true
  unrs-resolver: true

overrides:
  "@types/react": "19.2.7"
  "@types/react-dom": "19.2.3"
  "baseline-browser-mapping": "^2.10.31"
  "react-is": "^19.2.6"
